name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

env:
  FOUNDRY_PROFILE: ci
  ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Check Forge formatting
        run: forge fmt --check

      - name: Validate V2 deployment tooling
        run: |
          python -m compileall -q cli
          python -m unittest discover -s cli/emergency_spells -t . -v

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
